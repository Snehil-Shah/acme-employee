app = "the-employee"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  GITHUB_REPO = "Snehil-Shah/acme-employee"
  GITHUB_APP_ID = "5301327"
  PUBLIC_URL = "https://the-employee.fly.dev"
  # Haiku for everything: it handles curation well, and anyone can spend on the
  # public demo, so it stays cheap by default.
  AGENT_MODEL = "anthropic:claude-haiku-4-5"
  CHAT_MODEL = "anthropic:claude-haiku-4-5"
  # Everything the demo commits shows as the GitHub App's bot (its avatar on
  # GitHub); trailers still record which agent proposed and what was decided.
  APPROVER_NAME = "the-employee[bot]"
  APPROVER_EMAIL = "342023103+the-employee[bot]@users.noreply.github.com"
  THE_EMPLOYEE_GIT_NAME = "the-employee[bot]"
  THE_EMPLOYEE_GIT_EMAIL = "342023103+the-employee[bot]@users.noreply.github.com"

# One machine that stays up: agent runs take minutes and must not be cut off
# by the machine stopping when the visitor closes the tab.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "employee_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
